<!-- form.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>

<div class="container">
  <h2>Student Registration Form</h2>

  <form id="studentForm">
    <input type="text" id="fullName" placeholder="Full Name">
    <small id="nameError" class="error"></small>

    <input type="email" id="email" placeholder="Email Address">
    <small id="emailError" class="error"></small>

    <input type="password" id="password" placeholder="Password">
    <small id="passwordError" class="error"></small>

    <input type="password" id="confirmPassword" placeholder="Confirm Password">
    <small id="confirmPasswordError" class="error"></small>

    <input type="text" id="phone" placeholder="Phone Number">
    <small id="phoneError" class="error"></small>

    <div class="group">
      <label><input type="radio" name="gender" value="Male"> Male</label>
      <label><input type="radio" name="gender" value="Female"> Female</label>
    </div>
    <small id="genderError" class="error"></small>

    <select id="course">
      <option value="">Select Course</option>
      <option>BSCS</option>
      <option>BSIT</option>
      <option>BBA</option>
      <option>MBA</option>
    </select>
    <small id="courseError" class="error"></small>

    <div class="group">
      <label><input type="checkbox" name="hobby" value="Reading"> Reading</label>
      <label><input type="checkbox" name="hobby" value="Gaming"> Gaming</label>
      <label><input type="checkbox" name="hobby" value="Sports"> Sports</label>
    </div>
    <small id="hobbyError" class="error"></small>

    <textarea id="message" placeholder="About Yourself"></textarea>
    <small id="messageError" class="error"></small>

    <button type="submit">Submit</button>
  </form>

  <div id="result"></div>
</div>

<script src="form.js"></script>
</body>
</html>
